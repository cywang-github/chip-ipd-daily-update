name: Daily IPD Knowledge Update

on:
  schedule:
    # 北京时间 8:30 = UTC 0:30
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily IPD update
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python auto_daily_update.py

      - name: Commit push log back to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ipd_knowledge_base/output/push_log.txt ipd_knowledge_base/output/index.html
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: 每日IPD更新 — $(TZ='Asia/Shanghai' date +%Y-%m-%d)"
            git push
          fi

      - name: Upload report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipd-report-${{ github.run_id }}
          path: ipd_knowledge_base/output/index.html
          retention-days: 30
